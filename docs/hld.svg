<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
<title id="title">Abuse Your Manager — implemented high-level design</title><desc id="desc">Readers and writers access a browser interface backed by a Flask API. Mutations pass authentication and validation. PostgreSQL in production and SQLite locally hold credentials, stories and reports. An operator uses moderation tools.</desc>
