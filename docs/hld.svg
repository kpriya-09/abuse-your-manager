<g font-family="Arial,sans-serif" fill="#282c26" text-anchor="middle"><text x="147" y="232" font-size="18" font-weight="bold">Reader</text><text x="147" y="255" font-size="13">No account required</text><text x="147" y="349" font-size="18" font-weight="bold">Writer</text><text x="147" y="373" font-size="13">Private login + password</text><text x="415" y="232" font-size="20" font-weight="bold">Browser UI</text><text x="415" y="260" font-size="13">HTML / CSS / JavaScript</text><text x="415" y="282" font-size="13">Locally hosted fonts</text><text x="415" y="305" font-size="13">Public aliases only</text><text x="745" y="233" font-size="19" font-weight="bold">Flask API</text><text x="745" y="258" font-size="13">Vercel Python runtime</text><text x="745" y="387" font-size="18" font-weight="bold">Write gate</text><text x="745" y="413" font-size="13">Origin + JSON + custom header</text><text x="745" y="436" font-size="13">Session / validation / limits</text><text x="207" y="613" font-size="18" font-weight="bold">Trusted operator</text><text x="207" y="637" font-size="13">Private database access</text><text x="603" y="612" font-size="18" font-weight="bold">Moderation tools</text><text x="603" y="638" font-size="13">Read reports · hide / restore</text><text x="1086" y="216" font-size="21" font-weight="bold">Managed PostgreSQL</text><text x="1086" y="239" font-size="12">SQLite for local development</text><text x="1086" y="293" font-size="16" font-weight="bold">Private identity</text><text x="1086" y="317" font-size="13">Users / password hashes</text><text x="1086" y="339" font-size="13">Hashed session tokens</text><text x="1086" y="385" font-size="16" font-weight="bold">Community</text><text x="1086" y="409" font-size="13">Stories / replies / votes</text><text x="1086" y="459" font-size="16" font-weight="bold">Operations</text><text x="1086" y="483" font-size="13">Reports / rate-limit buckets</text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#8f432c"><text x="548" y="222">GET</text><text x="537" y="371">POST</text><text x="770" y="329">Authorized</text><text x="72" y="481">Identity is pseudonymous, not untraceable.</text><text x="72" y="504">The operator can link accounts to their contributions.</text></g>
<path d="M55 705H1225" stroke="#bfc2b2"/><text x="55" y="739" font-family="Arial,sans-serif" font-size="13" fill="#656b5c">IMPLEMENTED: public reading · persistent aliases · stories · replies · votes · reports · manual moderation</text><text x="55" y="763" font-family="Arial,sans-serif" font-size="12" fill="#656b5c">NOT DEPLOYED: public HTTPS hosting, account recovery, distributed scaling and staffed moderation remain launch decisions.</text></svg>
